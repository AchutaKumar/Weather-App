<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=water_drop" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <!-- main section  -->
    <main class="main-container">

        <header class="search-bar">
            <input type="text" class="city-input" placeholder="Search the city">
            <button class="search-btn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>

        <section class="weather-section" style="display: none;">
            <!-- location section  -->

            <section class="location-section">
                <div class="location">
                    <span><i class="fa-solid fa-location-dot"></i></span>
                    <h3 class="state">State</h3>
                </div>
                <div class="date">
                    Wed, 01, 2026
                </div>
            </section>

            <section class="weather">
                <div class="weather-img"></div>
                <div class="weather-detail">
                    <span class="temp">29 °C</span>
                    <span class="condition">CLOUD</span>
                </div>
            </section>

            <section class="more-detail">
                <div class="humidity">
                    <div class="hum-img">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M491-200q12-1 20.5-9.5T520-230q0-14-9-22.5t-23-7.5q-41 3-87-22.5T343-375q-2-11-10.5-18t-19.5-7q-14 0-23 10.5t-6 24.5q17 91 80 130t127 35ZM480-80q-137 0-228.5-94T160-408q0-100 79.5-217.5T480-880q161 137 240.5 254.5T800-408q0 140-91.5 234T480-80Zm0-80q104 0 172-70.5T720-408q0-73-60.5-165T480-774Q361-665 300.5-573T240-408q0 107 68 177.5T480-160Zm0-320Z" />
                        </svg>
                    </div>
                    <div class="hum-detail">
                        <p>Humidity</p>
                        <p class="hum-val">55%</p>
                    </div>
                </div>
                <div class="wind">
                    <div class="wind-img">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M460-160q-50 0-85-35t-35-85h80q0 17 11.5 28.5T460-240q17 0 28.5-11.5T500-280q0-17-11.5-28.5T460-320H80v-80h380q50 0 85 35t35 85q0 50-35 85t-85 35ZM80-560v-80h540q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43h-80q0-59 40.5-99.5T620-840q59 0 99.5 40.5T760-700q0 59-40.5 99.5T620-560H80Zm660 320v-80q26 0 43-17t17-43q0-26-17-43t-43-17H80v-80h660q59 0 99.5 40.5T880-380q0 59-40.5 99.5T740-240Z" />
                        </svg>
                        <div class="hum-detail">
                            <p>Wind Speed</p>
                            <p class="wind-val">4 M/s</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="cards">
                <div class="">

                </div>
            </section>
        </section>

        <section class="search-city ">
            <div class="search-city-img"></div>
            <div class="search-city-detail">
                <h3>Search City</h3>
                <p>Find out the weather condition</p>
            </div>
        </section>

        <section class="not-found" style="display: none;">
            <div class="not-found-img"></div>
            <p>CITY NOT FOUND</p>
        </section>
    </main>



    <script src="script.js" defer></script>
</body>

</html>
